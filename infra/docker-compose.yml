services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.54.3
    command: start-from-init --config /config.yaml --steps /init.yaml --masterkey "${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}"
    environment:
      POSTGRES_ROOT_PASSWORD: ${POSTGRES_ROOT_PASSWORD:-postgres}
    volumes:
      - ./zitadel/config.yaml:/config.yaml:ro
      - ./zitadel/init.yaml:/init.yaml:ro
      - zitadel_machinekey:/machinekey
    user: "0" # DEV ONLY: root needed to write PAT to /machinekey volume
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready", "--config", "/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile.dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: nutrometra
      POSTGRES_USER: nutrometra
      POSTGRES_PASSWORD: nutrometra_dev
      REDIS_ADDR: redis:6379
      ZITADEL_ISSUER: http://zitadel:8080
      ZITADEL_DOMAIN: zitadel
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-placeholder}
      API_PORT: 8081
      API_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ../services/api:/app
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zitadel:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  zitadel_machinekey:
