services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      APP_DB_USER: ${POSTGRES_USER}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.54.3
    command: start-from-init --config /config.yaml --steps /init.yaml --masterkey "${ZITADEL_MASTERKEY}"
    environment:
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
    volumes:
      - ./zitadel/config.yaml:/config.yaml:ro
      - ./zitadel/init.yaml:/init.yaml:ro
      - zitadel_machinekey:/machinekey
    user: "0" # DEV ONLY: root needed to write PAT to /machinekey volume
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready", "--config", "/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile.dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_ADDR: redis:6379
      ZITADEL_ISSUER: ${ZITADEL_ISSUER}
      ZITADEL_DOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID}
      API_PORT: ${API_PORT:-8081}
      API_ENV: ${API_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - ../services/api:/app
    ports:
      - "${API_PORT:-8081}:${API_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zitadel:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  zitadel_machinekey:
