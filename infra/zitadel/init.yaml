# Admin password is injected via environment variable in docker-compose.yml:
#   ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
FirstInstance:
  InstanceName: Nutrometra
  DefaultLanguage: pt
  Org:
    Name: Nutrometra
    Human:
      UserName: admin
      FirstName: Admin
      LastName: Nutrometra
      Email:
        Address: admin@nutrometra.local
        Verified: true
      PasswordChangeRequired: false
    Machine:
      Machine:
        Username: setup-sa
        Name: Setup Service Account
      MachineKey:
        Type: 1
        ExpirationDate: "2030-01-01T00:00:00Z"
      Pat:
        ExpirationDate: "2030-01-01T00:00:00Z"
  PatPath: /machinekey/zitadel-admin-sa.pat
  MachineKeyPath: /machinekey/zitadel-admin-sa.json
