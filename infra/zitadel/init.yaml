# All sensitive values are injected via environment variables in docker-compose.yml.
# See .env.example for the full list.
FirstInstance:
  InstanceName: Nutrometra
  DefaultLanguage: pt
  Org:
    Name: Nutrometra
    Human:
      # Injected via ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
      # Injected via ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME
      # Injected via ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME
      Email:
        # Injected via ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS
        Verified: true
      PasswordChangeRequired: false
    Machine:
      Machine:
        Username: setup-sa
        Name: Setup Service Account
      MachineKey:
        Type: 1
        ExpirationDate: "2030-01-01T00:00:00Z"
      Pat:
        ExpirationDate: "2030-01-01T00:00:00Z"
  PatPath: /machinekey/zitadel-admin-sa.pat
  MachineKeyPath: /machinekey/zitadel-admin-sa.json
