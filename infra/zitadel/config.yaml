Log:
  Level: info
  Formatter:
    Format: text

Port: 8080
ExternalDomain: zitadel
ExternalPort: 8080
ExternalSecure: false

TLS:
  Enabled: false

# Passwords are injected via environment variables in docker-compose.yml:
#   ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
#   ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
Database:
  Postgres:
    Host: postgres
    Port: 5432
    Database: zitadel
    MaxOpenConns: 20
    MaxIdleConns: 10
    MaxConnLifetime: 30m
    MaxConnIdleTime: 5m
    User:
      Username: postgres
      SSL:
        Mode: disable
    Admin:
      Username: postgres
      SSL:
        Mode: disable

DefaultInstance:
  Language: pt
  Org:
    Name: Nutrometra Internal
